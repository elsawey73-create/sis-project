// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Keep our modules on Java 17 even after `cap sync` rewrites generated Gradle files.
subprojects { sub ->
    sub.afterEvaluate {
        def ours = sub.plugins.hasPlugin('com.android.application') || sub.name == 'capacitor-cordova-android-plugins'
        if (ours) {
            sub.android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
            sub.android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
        }
    }
}
